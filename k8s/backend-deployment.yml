kind: Deployment
apiVersion: apps/v1
metadata:
    name: backend-deployment
    namespace: apexbank
spec:
    replicas: 1
    selector:
        matchLabels:
            app: backend
    template:
        metadata:
            labels:
                app: backend
        spec:
            containers:
            - name: backend
              image: buildwithsumeet/apex-bank-backend:latest
              imagePullPolicy: IfNotPresent
              ports:
              - containerPort: 5000
              envFrom:
              - secretRef:
                  name: bankapi-secret
              - configMapRef:
                  name: mongo-config
              livenessProbe:
                httpGet:
                  path: /api/health
                  port: 5000
                initialDelaySeconds: 15
                periodSeconds: 15
                timeoutSeconds: 5
              readinessProbe:
                httpGet:
                  path: /api/health
                  port: 5000
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 3
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"