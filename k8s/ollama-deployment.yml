kind: Deployment
apiVersion: apps/v1
metadata:
    name: ollama-deployment
    namespace: apexbank
spec:
    replicas: 1
    selector:
        matchLabels:
            app: ollama
    template:
        metadata:
            labels:
                app: ollama
        spec:
            containers:
            - name: ollama
              image: ollama/ollama:latest
              ports:
              - containerPort: 11434
              volumeMounts:
              - mountPath: /root/.ollama
                name: ollama-storage
              livenessProbe:
                httpGet:
                  path: /api/tags
                  port: 11434
                initialDelaySeconds: 30
                periodSeconds: 25
                timeoutSeconds: 5
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1000m"
                  memory: "1.5Gi"
            volumes:
            - name: ollama-storage
              persistentVolumeClaim:
                  claimName: ollama-pvc

