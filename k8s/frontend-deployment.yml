kind: Deployment
apiVersion: apps/v1
metadata:
    name: frontend-deployment
    namespace: apexbank
spec:
    replicas: 1
    selector:
        matchLabels:
            app: frontend
    template:
        metadata:
            labels:
                app: frontend
        spec:
            containers:
            - name: frontend
              image: buildwithsumeet/apex-bank-frontend:latest
              ports:
              - containerPort: 80
              envFrom:
              - configMapRef:
                  name: mongo-config
              