kind: Deployment
apiVersion: apps/v1
metadata:
    name: frontend-deployment
    namespace: apexbank
spec:
    replicas: 1
    selector:
        matchLabels:
            app: frontend
    template:
        metadata:
            labels:
                app: frontend
        spec:
            containers:
            - name: frontend
              image: buildwithsumeet/apex-bank-frontend:latest
              imagePullPolicy: IfNotPresent
              ports:
              - containerPort: 80
              envFrom:
              - configMapRef:
                  name: mongo-config
              livenessProbe:
                httpGet:
                  path: /
                  port: 80
                initialDelaySeconds: 10
                periodSeconds: 15
                timeoutSeconds: 5
              readinessProbe:
                httpGet:
                  path: /
                  port: 80
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 3
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "250m"
                  memory: "256Mi"
              