apiVersion: apps/v1
kind: Deployment
metadata:
    name: mongo-deployment
    namespace: apexbank
spec:
    replicas: 1
    selector:
        matchLabels:
            app: mongo
    template:
        metadata:
            labels:
                app: mongo
        spec:
            containers:
            - name: mongo
              image: mongo:latest
              ports:
              - containerPort: 27017
              envFrom:
              - secretRef:
                  name: bankapi-secret
              - configMapRef:
                  name: mongo-config
              volumeMounts:
              - mountPath: /data/db
                name: mongo-storage
              livenessProbe:
                tcpSocket:
                  port: 27017
                initialDelaySeconds: 20
                periodSeconds: 20
                timeoutSeconds: 5
              resources:
                requests:
                  cpu: "150m"
                  memory: "256Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"
            volumes:
            - name: mongo-storage
              persistentVolumeClaim:
                claimName: mongo-pvc

