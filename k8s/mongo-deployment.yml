apiVersion: apps/v1
kind: Deployment
metadata:
    name: mongo-deployment
    namespace: apexbank
spec:
    replicas: 1
    selector:
        matchLabels:
            app: mongo
    template:
        metadata:
            labels:
                app: mongo
        spec:
            containers:
            - name: mongo
              image: mongo:latest
              ports:
              - containerPort: 27017
              envFrom:
              - secretRef:
                  name: bankapi-secret
              - configMapRef:
                  name: mongo-config
              volumeMounts:
              - mountPath: /data/db
                name: mongo-storage
            volumes:
            - name: mongo-storage
              persistentVolumeClaim:
                claimName: mongo-pvc

