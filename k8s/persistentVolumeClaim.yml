kind: PersistentVolumeClaim
apiVersion: v1
metadata:
    name: mongo-pvc
    namespace: apexbank
spec:
    storageClassName: standard
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi
  
